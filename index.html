    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>


    <!-- Password interface -->
    <main class="password-screen">

        <!-- Password dots -->
        <div class="password-dots" id="passwordDots">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>


        <!-- Invisible keypad -->
        <div class="keypad">

            <!-- Row 1 -->
            <button class="key" data-number="1"></button>
            <button class="key" data-number="2"></button>
            <button class="key" data-number="3"></button>

            <!-- Row 2 -->
            <button class="key" data-number="4"></button>
            <button class="key" data-number="5"></button>
            <button class="key" data-number="6"></button>

            <!-- Row 3 -->
            <button class="key" data-number="7"></button>
            <button class="key" data-number="8"></button>
            <button class="key" data-number="9"></button>

            <!-- Row 4 -->
            <button class="key empty"></button>
            <button class="key" data-number="0"></button>
            <button class="key" id="deleteButton"></button>

        </div>

    </main>


    <!-- Success message -->
    <div class="success-screen" id="successScreen">

        <div class="success-box">

            <div class="heart">♡</div>

            <h1>Welcome ♡</h1>

            <p>You found the secret.</p>

            <button id="continueButton">
                Continue
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
