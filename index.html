<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         MAIN SECRET LOCK SCREEN
    ====================================================== -->

    <main id="lockScreen">

        <!-- =================================================
             ATMOSPHERE
        ================================================== -->

        <div class="golden-glow"></div>

        <div class="light-burst"></div>

        <div id="particles"></div>


        <!-- =================================================
             MAGICAL GARDEN CREATURES
        ================================================== -->

        <div id="gardenCreatures"></div>


        <!-- =================================================
             LOCK AREA
        ================================================== -->

        <div
            class="lock-area"
            id="lockArea"
        >

            <!-- =================================================
                 LOCK + KEY
            ================================================== -->

            <div class="lock-wrapper">

                <!-- HEART LOCK -->

                <div
                    class="heart-lock"
                    id="heartLock"
                >

                    <div class="lock-shackle">
                        <div class="shackle-inner"></div>
                    </div>

                    <div class="heart-body">

                        <div class="keyhole">
                            <div class="keyhole-circle"></div>
                            <div class="keyhole-line"></div>
                        </div>

                    </div>

                </div>


                <!-- GOLDEN KEY -->

                <div
                    class="golden-key"
                    id="goldenKey"
                >

                    <div class="key-ring"></div>

                    <div class="key-shaft"></div>

                    <div class="key-teeth">
                        <span></span>
                        <span></span>
                    </div>

                </div>

            </div>


            <!-- =================================================
                 LOCK TEXT
            ================================================== -->

            <div class="lock-text">

                <h1>
                    ..... <span>♡</span>
                </h1>

                <p id="instruction">
                    Enter the secret code...
                </p>


                <div
                    class="code-display"
                    id="codeDisplay"
                >

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


            <!-- =================================================
                 KEYPAD
            ================================================== -->

            <div
                class="keypad"
                id="keypad"
            >

                <button
                    class="key"
                    data-number="1"
                    type="button"
                >
                    1
                </button>

                <button
                    class="key"
                    data-number="2"
                    type="button"
                >
                    2
                </button>

                <button
                    class="key"
                    data-number="3"
                    type="button"
                >
                    3
                </button>


                <button
                    class="key"
                    data-number="4"
                    type="button"
                >
                    4
                </button>

                <button
                    class="key"
                    data-number="5"
                    type="button"
                >
                    5
                </button>

                <button
                    class="key"
                    data-number="6"
                    type="button"
                >
                    6
                </button>


                <button
                    class="key"
                    data-number="7"
                    type="button"
                >
                    7
                </button>

                <button
                    class="key"
                    data-number="8"
                    type="button"
                >
                    8
                </button>

                <button
                    class="key"
                    data-number="9"
                    type="button"
                >
                    9
                </button>


                <button
                    class="key empty"
                    type="button"
                    aria-hidden="true"
                    tabindex="-1"
                ></button>

                <button
                    class="key"
                    data-number="0"
                    type="button"
                >
                    0
                </button>

                <button
                    class="key backspace"
                    id="backspace"
                    type="button"
                    aria-label="Backspace"
                >
                    ⌫
                </button>

            </div>

        </div>


        <!-- =====================================================
             UNLOCK MESSAGE
        ====================================================== -->

        <div
            class="unlock-message"
            id="unlockMessage"
        >

            <div class="unlock-icon">
                ✦
            </div>

            <h2>
                You found the key.
            </h2>

            <p>
                Some things are worth unlocking.
            </p>

        </div>


        <!-- =====================================================
             COME INSIDE MESSAGE
        ====================================================== -->

        <div
            class="come-inside"
            id="comeInside"
        >

            <div class="small-key">
                🔑
            </div>

            <h2>
                Come inside...
            </h2>

            <p>
                There's something waiting....
            </p>

        </div>


        <!-- =====================================================
             SECRET WORLD
        ====================================================== -->

        <section
            class="secret-world"
            id="secretWorld"
        >

            <div class="world-content">

                <div class="world-symbol">
                    ☾
                </div>

                <p class="little-label">
                    WELCOME
                </p>

                <h2>
                    A little world<br>
                    .....
                </h2>

                <p class="world-description">
                    Every little corner holds something
                    waiting to be discovered.
                </p>

                <button
                    class="enter-world"
                    id="enterWorld"
                    type="button"
                >
                    Enter the garden ✦
                </button>

            </div>

        </section>


        <!-- =====================================================
             TULIP GARDEN
        ====================================================== -->

        <section
            class="tulip-garden"
            id="tulipGarden"
        >

            <div class="garden-heading">

                <p>
                    A LITTLE GARDEN
                </p>

                <h2>
                    Six little moments
                </h2>

                <span>
                    Choose one... 🌷
                </span>

            </div>


            <!-- =================================================
                 TULIP 1
            ================================================== -->

            <button
                class="tulip-card"
                data-video="video1.mp4"
                data-message="A little moment, saved just for you. ♡"
                type="button"
            >

                <img
                    src="tulip1.jpg"
                    alt="Pink tulip"
                >

                <span class="tulip-shine"></span>

            </button>


            <!-- =================================================
                 TULIP 2
            ================================================== -->

            <button
                class="tulip-card"
                data-video="video2.mp4"
                data-message="Some memories are better when you can watch them again. ✦"
                type="button"
            >

                <img
                    src="tulip2.jpg"
                    alt="Pink tulip"
                >

                <span class="tulip-shine"></span>

            </button>


            <!-- =================================================
                 TULIP 3
            ================================================== -->

            <button
                class="tulip-card"
                data-video="video3.mp4"
                data-message="A tiny piece of happiness, kept here for you."
                type="button"
            >

                <img
                    src="tulip3.jpg"
                    alt="Pink tulip"
                >

                <span class="tulip-shine"></span>

            </button>


            <!-- =================================================
                 TULIP 4
            ================================================== -->

            <button
                class="tulip-card"
                data-video="video4.mp4"
                data-message="This little moment belongs in our garden. ♡"
                type="button"
            >

                <img
                    src="tulip4.jpg"
                    alt="Pink tulip"
                >

                <span class="tulip-shine"></span>

            </button>


            <!-- =================================================
                 TULIP 5
            ================================================== -->

            <button
                class="tulip-card"
                data-video="video5.mp4"
                data-message="Some things don't need many words."
                type="button"
            >

                <img
                    src="tulip5.jpg"
                    alt="Pink tulip"
                >

                <span class="tulip-shine"></span>

            </button>


            <!-- =================================================
                 TULIP 6
            ================================================== -->

            <button
                class="tulip-card"
                data-video="video6.mp4"
                data-message="And this one is just for you. ✦"
                type="button"
            >

                <img
                    src="tulip6.jpg"
                    alt="Pink tulip"
                >

                <span class="tulip-shine"></span>

            </button>

        </section>


        <!-- =====================================================
             VIDEO POPUP
        ====================================================== -->

        <div
            class="video-modal"
            id="videoModal"
        >

            <div
                class="video-backdrop"
                id="videoBackdrop"
            ></div>


            <div class="video-box">

                <button
                    class="close-video"
                    id="closeVideo"
                    type="button"
                    aria-label="Close video"
                >
                    ×
                </button>


                <div class="video-frame">

                    <video
                        id="gardenVideo"
                        controls
                        playsinline
                    >
                        <source
                            id="videoSource"
                            src=""
                            type="video/mp4"
                        >

                        Your browser does not support video.
                    </video>

                </div>


                <p
                    class="video-message"
                    id="videoMessage"
                ></p>

            </div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
